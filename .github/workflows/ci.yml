name: CI

on:
  push:
    paths-ignore:
      - "EXAMPLES.md"
      - "gallery-badge/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit test (140 test — lexer/parser/VM/REPL/CLI)
        run: python3 -m unittest discover -s tests -v

      - name: Regenerasi EXAMPLES.md (deterministik — contoh dijalankan sungguhan)
        run: python3 make_examples.py

      - name: Commit EXAMPLES.md jika berubah
        run: |
          git config user.name  "lunarjjo-agent"
          git config user.email "313322027+lunarjjo@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan — lewati commit"
          else
            git commit -m "chore: regenerasi EXAMPLES.md [skip ci]"
            git push
          fi
