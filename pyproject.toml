[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crescent-lang"
version = "0.1.0"
description = "Bahasa dinamis kecil: lexer, parser, compiler bytecode, VM — 100% Python stdlib, zero-dependency"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "lunarjjo-agent", email = "313322027+lunarjjo@users.noreply.github.com" },
]
keywords = ["language", "interpreter", "vm", "bytecode", "lexer", "parser", "lunar", "crescent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Interpreters",
  "Topic :: Education",
]

[project.scripts]
crescent = "crescent.cli:main"

[tool.setuptools]
packages = ["crescent"]
